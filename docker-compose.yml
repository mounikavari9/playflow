# Local development infrastructure. Not for production use.
# Credentials default to development-only values; override them in a local,
# gitignored .env file (see .env.example).
name: playflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playflow}
      POSTGRES_DB: ${POSTGRES_DB:-playflow}
    ports:
      # Bound to loopback only, so the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # A password is required even locally so the client's auth path is always
    # exercised. --requirepass is visible in the container's process list,
    # which is acceptable for this dev-only service. No data volume: Redis data
    # is disposable here and `docker compose down` discards it.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-playflow}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-playflow}
    ports:
      # Bound to loopback only, so Redis is not reachable from the network.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      # REDISCLI_AUTH keeps the password off the redis-cli command line.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
