# golangci-lint configuration. Run it with `make lint` from the repository root.
# The tool version is pinned by GOLANGCI_LINT_VERSION in the Makefile.
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  # Every linter is listed here, so upgrading the tool cannot change the set.
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - noctx
    - staticcheck
    - unused
  exclusions:
    rules:
      # Tests use fake credentials and httptest requests on purpose.
      - path: _test\.go
        linters:
          - gosec
          - noctx

issues:
  # Remove the tool's default limits on repeated findings. It may still display
  # only one finding per line, so fixing one can reveal another on that line.
  max-issues-per-linter: 0
  max-same-issues: 0
